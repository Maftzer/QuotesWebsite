<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quotes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header>
    <a class="logo" href="index.html">Quotes</a>
    <form class="search" action="quotes.html" method="get">
      <input type="search" name="search" placeholder="Search quote, author or category" required>
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <section>
      <h2>Quote of the day</h2>
      <div id="quote-of-the-day"></div>
    </section>

    <div class="columns">
      <section>
        <h2>Popular topics</h2>
        <ul id="popular-categories" class="list"></ul>
        <a class="button" href="categories.html">More categories</a>
      </section>

      <section>
        <h2>Popular authors</h2>
        <ul id="popular-authors" class="list"></ul>
        <a class="button" href="authors.html">More authors</a>
      </section>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
